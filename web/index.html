<!DOCTYPE html>

  <script>
    (function() {
      var p = window.location.pathname;
      if (p === '/admin' || p === '/admin/' || p.endsWith('/admin') || p.endsWith('/admin/')) {
        var base = p.replace(/\/admin\/?$/, '');
        var target = (base ? base : '') + '/#/admin' + window.location.search;
        if (window.location.hash !== '#/admin') {
          window.location.replace(target);
        }
      }
    })();

    // Prevent Flutter Web ViewInsets negative assertion bug during mobile device emulation / resize
    try {
      if (window.visualViewport) {
        var origHeight = Object.getOwnPropertyDescriptor(VisualViewport.prototype, 'height');
        if (origHeight && origHeight.get) {
          Object.defineProperty(window.visualViewport, 'height', {
            get: function() {
              var h = origHeight.get.call(this);
              return Math.min(h, window.innerHeight);
            }
          });
        }
      }
    } catch (e) {}
  </script>

    html, body {

      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Hide the raw blue progress bar */
    .flutter-loader {

    /* Luxury Branded Preloader */
    #nb-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0F0D0B;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999999;
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
    }

    .nb-splash-circle {
      position: relative;
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .nb-splash-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(212, 175, 55, 0.15);
      border-top-color: #D4AF37;
      animation: nb-spin 1.1s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;

    .nb-splash-logo {
      width: 54px;
      height: 54px;
      border-radius: 50%;

      justify-content: center;

      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    @keyframes nb-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

<body style="background-color: #0F0D0B;">

    </div>
    <div class="nb-splash-title">NB DEVELOPER</div>
    <div class="nb-splash-sub">NB Legacy Tower</div>
  </div>

  <script>
    function hideSplash() {
      var splash = document.getElementById('nb-splash');
      if (splash && splash.style.opacity !== '0') {
        splash.style.opacity = '0';
        splash.style.pointerEvents = 'none';
        setTimeout(function() {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 250);
      }
    }

    // 1. Flutter first frame listener
    window.addEventListener('flutter-first-frame', hideSplash);

    // 2. Active DOM check: dismiss as soon as Flutter canvas / glass-pane appears
    var checkTimer = setInterval(function() {
      if (document.querySelector('flt-glass-pane') || document.querySelector('flutter-view') || document.querySelector('flt-scene-host')) {
        clearInterval(checkTimer);
        hideSplash();
      }
    }, 80);

    // 3. Maximum fallback: never stay more than 2.5 seconds
    setTimeout(function() {
      clearInterval(checkTimer);
      hideSplash();
    }, 2500);
  </script>
